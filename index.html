<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20fill='%232d7ef7'%20d='M12%202l8%203v6c0%205-3.5%208.5-8%2011-4.5-2.5-8-6-8-11V5z'/%3E%3C/svg%3E" />
<title>안심길 — 안전 경로</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin:0; height:100%; font-family:'Malgun Gothic',sans-serif; background:#0b0e13; }
  #map { position:absolute; inset:0; z-index:0; }
  .panel { position:absolute; z-index:600; background:rgba(20,24,33,.9); color:#fff;
           border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.5;
           box-shadow:0 4px 16px rgba(0,0,0,.4); }
  #title { top:12px; left:12px; font-size:15px; font-weight:700; }
  #title small { display:block; font-weight:400; opacity:.8; font-size:11px; margin-top:2px; }
  #ctrl { top:70px; left:12px; width:270px; }
  #ctrl h4 { margin:0 0 8px; font-size:13px; opacity:.9; }
  #ctrl .row { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  #ctrl .ac { position:relative; flex:1; min-width:0; }
  #ctrl input[type=text] { width:100%; box-sizing:border-box; padding:6px 8px; border-radius:6px;
           border:1px solid #3a4152; background:#11151d; color:#fff; font-size:12px; }
  #ctrl button { padding:6px 9px; border:0; border-radius:6px; background:#2b3446; color:#fff;
           font-size:12px; cursor:pointer; white-space:nowrap; }
  #ctrl button.primary { background:#2d7ef7; }
  #ctrl select { width:100%; margin-top:4px; padding:5px 7px; border-radius:6px; background:#11151d;
           color:#fff; border:1px solid #3a4152; font-size:12px; }
  #ctrl .hint { font-size:11px; opacity:.6; margin:2px 0 8px; }
  #ctrl .sep { border-top:1px solid #2a3140; margin:8px 0; }
  #ctrl label.ck { display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; }
  #ctrl .layer { font-size:12px; margin-top:6px; }
  #status { margin-top:8px; font-size:12px; min-height:16px; }
  #status b { color:#5fd08a; }
  #analysis { margin-top:6px; font-size:12px; line-height:1.55; }
  #analysis .bar2 { display:inline-block; height:8px; border-radius:4px; vertical-align:middle; margin:0 5px; }
  .sugg { position:absolute; top:calc(100% + 2px); left:0; right:0; z-index:30; background:#11151d;
          border:1px solid #3a4152; border-radius:6px; max-height:240px; overflow-y:auto; display:none; }
  .sugg.open { display:block; }
  .sugg .it { padding:7px 9px; cursor:pointer; border-bottom:1px solid #222a37; }
  .sugg .it .t { font-size:12px; color:#fff; }
  .sugg .it .a { font-size:10.5px; color:#9aa4b5; margin-top:1px; }
  .sugg .empty { padding:8px 9px; font-size:11px; color:#9aa4b5; }
  #legend { bottom:18px; left:12px; }
  #legend .bar { height:10px; width:180px; border-radius:5px; margin:7px 0 3px; }
  #legend .bar.risk { background:linear-gradient(90deg,#19c80a,#e6e60a,#dc1414); }
  #legend .bar.diff { background:linear-gradient(90deg,#3cc8d2,#8c6ed2,#e6327a); }
  #legend .bar.conf { background:linear-gradient(90deg,#e0a63c,#4aa3ff,#1560d0); }
  #legend .row { display:flex; justify-content:space-between; width:180px; font-size:11px; opacity:.85; }
  #err { top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(150,24,24,.94); display:none; max-width:360px; }
  #navbar { position:absolute; left:12px; right:12px; bottom:14px; z-index:700; display:none;
    align-items:center; justify-content:space-between; gap:12px; background:rgba(20,24,33,.94);
    color:#fff; border-radius:14px; padding:12px 16px; box-shadow:0 6px 22px rgba(0,0,0,.55); }
  #navbar.on { display:flex; }
  #navbar .dist { font-size:22px; font-weight:800; }
  #navbar .dist small { font-size:12px; font-weight:400; opacity:.75; margin-left:4px; }
  #navbar button { padding:11px 18px; border:0; border-radius:9px; background:#e2483a; color:#fff;
    font-size:15px; font-weight:600; }
  #navStartBtn { background:#12b886 !important; }
  .memark { font-size:24px; line-height:24px; color:#00d4ff; text-shadow:0 0 4px #000,0 0 2px #000; }
  @media (max-width:860px){
    #ctrl { width:calc(100vw - 24px); max-height:44vh; overflow-y:auto; }
    #ctrl.collapsed { max-height:50px; overflow:hidden; }
    #ctrl h4 { cursor:pointer; }
    #ctrl button, #ctrl input, #ctrl select { min-height:36px; font-size:13px; }
    #legend { display:none; } #title small { display:none; } #title { font-size:14px; }
  }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="title" class="panel">🛡️ 안심길 (Safe Path)
    <small>보행 안전경로 · 하남시</small></div>

  <div id="ctrl" class="panel">
    <h4>🧭 길찾기</h4>
    <div class="row">
      <div class="ac"><input type="text" id="startAddr" placeholder="출발지 검색 (예: 남한고등학교)" autocomplete="off" />
        <div class="sugg" id="startSugg"></div></div>
      <button id="gpsBtn" title="내 위치(GPS)">📍</button>
    </div>
    <div class="row">
      <div class="ac"><input type="text" id="goalAddr" placeholder="도착지 검색 (예: 하남시청)" autocomplete="off" />
        <div class="sugg" id="goalSugg"></div></div>
    </div>
    <div class="row">
      <button id="findBtn" class="primary">경로 찾기</button>
      <button id="resetBtn">초기화</button>
    </div>
    <div class="hint">장소 검색 또는 지도 클릭(출발→도착)으로 지정.</div>
    <div class="row"><button id="navStartBtn" class="primary">🧭 내비게이션 시작</button></div>
    <div class="sep"></div>
    <label class="ck"><input type="checkbox" id="avoidDiff" /> 보행난이도 회피 경로</label>
    <div class="layer">레이어: <select id="layerSel"></select></div>
    <label class="ck"><input type="checkbox" id="analyzeMode" /> 🔍 지점 분석(클릭 시 요소 기여도)</label>
    <div id="analysis"></div>
    <div id="status">불러오는 중…</div>
  </div>

  <div id="navbar"><div class="dist" id="navdist">–</div><button id="navEndBtn">✕ 종료</button></div>

  <div id="legend" class="panel">
    <span id="legendTitle">위험도</span>
    <div class="bar risk" id="legendBar"></div>
    <div class="row"><span>낮음</span><span>높음</span></div>
    <div style="margin-top:8px;">━ <span style="color:#37b6ff">추천 경로</span> · <span style="color:#ff3838">● 사고지점</span></div>
  </div>
  <div id="err" class="panel"></div>

<script>
(function () {
  const KEY = window.VWORLD_API_KEY || "";
  const RISK_W = 2.5, DIFF_W = 3.0, R = 6371000;
  const APP = { map:null, area:null, rows:0, cols:0, riskM:null, diffM:null, confM:null,
    factors:{}, weights:{}, flabels:{}, slopeDeg:null, aspect:null, alleyW:null, widthNarrow:null,
    accidents:[], validation:null, nodes:new Map(), adj:new Map(), comp:new Set(),
    startLL:null, goalLL:null, nextClick:"start", lastRoute:null, layerSel:"risk",
    heatLayer:null, routeLayer:null, mStart:null, mGoal:null, mMe:null, accLayer:null,
    navMode:false, navWatch:null, compassHeading:null, lastHeading:0 };

  if (!KEY) { showErr("V-World 인증키가 없습니다. web/config.js 확인."); return; }
  if (!window.L) { showErr("지도 라이브러리(Leaflet) 로드 실패. 네트워크 확인."); return; }
  init();

  async function init() {
    const bust = "?t=" + Date.now();
    let grid, roads;
    try {
      grid = await (await fetch("output/risk_grid.json" + bust)).json();
      roads = await (await fetch("output/roads_web.json" + bust)).json();
    } catch (e) { showErr("데이터 로드 실패. python serve.py 또는 배포 확인."); return; }

    APP.area = grid.area; APP.rows = grid.grid.rows; APP.cols = grid.grid.cols;
    const a = APP.area;
    APP.map = L.map("map", { zoomControl: true, attributionControl: false })
      .setView([(a.lat_min + a.lat_max) / 2, (a.lon_min + a.lon_max) / 2], 13);
    L.tileLayer("https://api.vworld.kr/req/wmts/1.0.0/" + KEY + "/Base/{z}/{y}/{x}.png",
      { maxZoom: 19, minZoom: 10 }).addTo(APP.map);

    buildMatrices(grid);
    populateLayerSelect();
    buildGraph(roads); bridgeGaps(15); APP.comp = largestComponent();
    renderHeatmap("risk");
    renderAccidents();
    showValidation();
    bindUI();

    const sp = 0.35;
    setStart(a.lat_min + sp * (a.lat_max - a.lat_min), a.lon_min + sp * (a.lon_max - a.lon_min));
    setGoal(a.lat_min + (1 - sp) * (a.lat_max - a.lat_min), a.lon_min + (1 - sp) * (a.lon_max - a.lon_min));
    APP.nextClick = "start"; computeRoute();
  }

  // ── 격자 값 ──
  function buildMatrices(g) {
    APP.riskM = g.risk; APP.diffM = g.diff; APP.confM = g.conf;
    APP.factors = {}; APP.weights = {}; APP.flabels = {};
    for (const k in (g.factors || {})) { APP.factors[k] = g.factors[k].layer; APP.weights[k] = g.factors[k].weight; APP.flabels[k] = g.factors[k].label; }
    APP.slopeDeg = g.slope_deg || null; APP.aspect = g.aspect || null;
    APP.accidents = g.accidents || []; APP.validation = g.validation || null;
    APP.alleyW = g.alley_width_m || null;
    APP.widthNarrow = APP.alleyW ? APP.alleyW.map((row) => row.map((w) => (w >= 0 ? Math.max(0, Math.min(1, (15 - w) / 13)) : 0))) : null;
  }
  function cellRC(lon, lat) {
    const a = APP.area;
    let c = Math.floor((lon - a.lon_min) / (a.lon_max - a.lon_min) * APP.cols);
    let r = Math.floor((lat - a.lat_min) / (a.lat_max - a.lat_min) * APP.rows);
    return [Math.min(Math.max(r, 0), APP.rows - 1), Math.min(Math.max(c, 0), APP.cols - 1)];
  }
  function valAt(M, lon, lat) { const rc = cellRC(lon, lat); return M[rc[0]][rc[1]]; }
  function meters(lo1, la1, lo2, la2) {
    const ml = (la1 + la2) / 2 * Math.PI / 180;
    return Math.hypot((lo2 - lo1) * Math.PI / 180 * Math.cos(ml) * R, (la2 - la1) * Math.PI / 180 * R);
  }
  function compass8(d) { return d < 0 ? "평지" : ["북 ↑","북동 ↗","동 →","남동 ↘","남 ↓","남서 ↙","서 ←","북서 ↖"][Math.round(d / 45) % 8]; }
  function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(2) + "km" : Math.round(m) + "m"; }
  function populateLayerSelect() {
    let h = '<option value="risk">통합 위험도</option><optgroup label="개별 요소">';
    for (const k in APP.factors) h += '<option value="f:' + k + '">' + (APP.flabels[k] || k) + '</option>';
    h += '</optgroup><option value="diff">보행 난이도</option><option value="conf">현실 반영 신뢰도</option>';
    if (APP.alleyW) h += '<option value="width">골목 폭(원도심)</option>';
    document.getElementById("layerSel").innerHTML = h;
  }

  // ── 도로망 그래프 (지도 무관) ──
  function nkey(lo, la) { return lo.toFixed(5) + "," + la.toFixed(5); }
  function buildGraph(roads) {
    (roads.lines || []).forEach((line) => {
      for (let i = 0; i < line.length - 1; i++) {
        const [lo1, la1] = line[i], [lo2, la2] = line[i + 1];
        const k1 = nkey(lo1, la1), k2 = nkey(lo2, la2);
        if (!APP.nodes.has(k1)) { APP.nodes.set(k1, [lo1, la1]); APP.adj.set(k1, []); }
        if (!APP.nodes.has(k2)) { APP.nodes.set(k2, [lo2, la2]); APP.adj.set(k2, []); }
        if (k1 === k2) continue;
        const dist = meters(lo1, la1, lo2, la2);
        const risk = 0.5 * (valAt(APP.riskM, lo1, la1) + valAt(APP.riskM, lo2, la2));
        const diff = 0.5 * (valAt(APP.diffM, lo1, la1) + valAt(APP.diffM, lo2, la2));
        APP.adj.get(k1).push({ to: k2, dist, risk, diff });
        APP.adj.get(k2).push({ to: k1, dist, risk, diff });
      }
    });
  }
  function bridgeGaps(maxM) {
    const cell = 0.00018, buckets = new Map();
    const bk = (lo, la) => Math.floor(lo / cell) + "," + Math.floor(la / cell);
    for (const [k, ll] of APP.nodes) { const b = bk(ll[0], ll[1]); if (!buckets.has(b)) buckets.set(b, []); buckets.get(b).push(k); }
    for (const [k, edges] of APP.adj) {
      if (edges.length !== 1) continue;
      const [lo, la] = APP.nodes.get(k); const bx = Math.floor(lo / cell), by = Math.floor(la / cell);
      let best = null, bd = maxM;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const arr = buckets.get((bx + dx) + "," + (by + dy)); if (!arr) continue;
        for (const k2 of arr) { if (k2 === k) continue; const [l2, a2] = APP.nodes.get(k2); const d = meters(lo, la, l2, a2); if (d < bd) { bd = d; best = k2; } }
      }
      if (best) {
        const [l2, a2] = APP.nodes.get(best);
        const risk = 0.5 * (valAt(APP.riskM, lo, la) + valAt(APP.riskM, l2, a2));
        const diff = 0.5 * (valAt(APP.diffM, lo, la) + valAt(APP.diffM, l2, a2));
        APP.adj.get(k).push({ to: best, dist: bd, risk, diff });
        APP.adj.get(best).push({ to: k, dist: bd, risk, diff });
      }
    }
  }
  function largestComponent() {
    const seen = new Set(); let best = new Set();
    for (const src of APP.adj.keys()) {
      if (seen.has(src)) continue;
      const comp = new Set(), stack = [src];
      while (stack.length) { const n = stack.pop(); if (comp.has(n)) continue; comp.add(n); for (const e of APP.adj.get(n)) if (!comp.has(e.to)) stack.push(e.to); }
      for (const n of comp) seen.add(n); if (comp.size > best.size) best = comp;
    }
    return best;
  }
  function nearestNode(lon, lat) {
    let best = null, bd = Infinity;
    for (const k of APP.comp) { const [nl, na] = APP.nodes.get(k); const d = meters(lon, lat, nl, na); if (d < bd) { bd = d; best = k; } }
    return best;
  }
  class MinHeap { constructor(){this.a=[];} get size(){return this.a.length;}
    push(x){const a=this.a;a.push(x);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(a[p][0]<=a[i][0])break;const t=a[p];a[p]=a[i];a[i]=t;i=p;}}
    pop(){const a=this.a,top=a[0],last=a.pop();if(a.length){a[0]=last;let i=0;const n=a.length;for(;;){let l=2*i+1,r=2*i+2,s=i;if(l<n&&a[l][0]<a[s][0])s=l;if(r<n&&a[r][0]<a[s][0])s=r;if(s===i)break;const t=a[s];a[s]=a[i];a[i]=t;i=s;}}return top;} }
  function astar(sKey, gKey, useDiff) {
    const [glon, glat] = APP.nodes.get(gKey);
    const h = (k) => { const [l, a] = APP.nodes.get(k); return meters(l, a, glon, glat); };
    const open = new MinHeap(); open.push([0, sKey]);
    const g = new Map([[sKey, 0]]), gd = new Map([[sKey, 0]]), came = new Map(), closed = new Set();
    while (open.size) {
      const cur = open.pop()[1];
      if (cur === gKey) break;
      if (closed.has(cur)) continue; closed.add(cur);
      for (const e of APP.adj.get(cur)) {
        if (closed.has(e.to)) continue;
        const step = e.dist * (1 + RISK_W * e.risk + (useDiff ? DIFF_W * e.diff : 0));
        const ng = g.get(cur) + step;
        if (ng < (g.has(e.to) ? g.get(e.to) : Infinity)) { g.set(e.to, ng); gd.set(e.to, gd.get(cur) + e.dist); came.set(e.to, cur); open.push([ng + h(e.to), e.to]); }
      }
    }
    if (!came.has(gKey) && sKey !== gKey) return null;
    const path = [gKey]; while (came.has(path[path.length - 1])) path.push(came.get(path[path.length - 1])); path.reverse();
    return { coords: path.map((k) => APP.nodes.get(k)), dist: gd.get(gKey) || 0 };
  }
  function computeRoute() {
    if (!APP.startLL || !APP.goalLL) return;
    const s = nearestNode(APP.startLL[0], APP.startLL[1]), gk = nearestNode(APP.goalLL[0], APP.goalLL[1]);
    if (!s || !gk) { setStatus("도로 노드를 찾지 못했습니다."); return; }
    const res = astar(s, gk, document.getElementById("avoidDiff").checked);
    if (!res) { setStatus("경로를 찾지 못했습니다."); return; }
    APP.lastRoute = res.coords; drawRoute(res.coords);
    setStatus("실거리 <b>" + fmtDist(res.dist) + "</b> (안전경로)");
  }

  // ── 렌더링 (Leaflet) ──
  function riskRGB(v){let r,g,b;if(v<0.5){const t=v/0.5;r=25+205*t;g=200+30*t;b=10;}else{const t=(v-0.5)/0.5;r=230-10*t;g=230-210*t;b=10+10*t;}return [Math.round(r),Math.round(g),Math.round(b)];}
  function diffRGB(v){let r,g,b;if(v<0.5){const t=v/0.5;r=60+80*t;g=200-90*t;b=210;}else{const t=(v-0.5)/0.5;r=140+90*t;g=110-60*t;b=210-90*t;}return [Math.round(r),Math.round(g),Math.round(b)];}
  function confRGB(v){let r,g,b;if(v<0.5){const t=v/0.5;r=224-100*t;g=166-30*t;b=60+195*t;}else{const t=(v-0.5)/0.5;r=124-103*t;g=136-40*t;b=255-47*t;}return [Math.round(r),Math.round(g),Math.round(b)];}
  function getLayer(sel) {
    if (sel === "diff") return { M: APP.diffM, rgb: diffRGB, title: "보행 난이도", thr: 0.10, bar: "diff" };
    if (sel === "conf") return { M: APP.confM, rgb: confRGB, title: "현실 반영 신뢰도", thr: 0.04, bar: "conf" };
    if (sel === "width") return { M: APP.widthNarrow, rgb: riskRGB, title: "골목 폭 — 좁을수록 빨강", thr: 0.05, bar: "risk" };
    if (sel && sel.indexOf("f:") === 0) { const k = sel.slice(2); return { M: APP.factors[k], rgb: riskRGB, title: (APP.flabels[k] || k), thr: 0.05, bar: "risk" }; }
    return { M: APP.riskM, rgb: riskRGB, title: "통합 위험도", thr: 0.06, bar: "risk" };
  }
  function layerCanvas(L2) {
    const rows = APP.rows, cols = APP.cols;
    const cv = document.createElement("canvas"); cv.width = cols; cv.height = rows;
    const ctx = cv.getContext("2d"); const img = ctx.createImageData(cols, rows);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const v = L2.M[r][c]; const idx = ((rows - 1 - r) * cols + c) * 4;
      if (v < L2.thr) { img.data[idx + 3] = 0; continue; }
      const col = L2.rgb(v); img.data[idx] = col[0]; img.data[idx + 1] = col[1]; img.data[idx + 2] = col[2]; img.data[idx + 3] = 255;
    }
    ctx.putImageData(img, 0, 0); return cv;
  }
  function renderHeatmap(sel) {
    APP.layerSel = sel; const L2 = getLayer(sel); if (!L2.M) return;
    const a = APP.area, bounds = [[a.lat_min, a.lon_min], [a.lat_max, a.lon_max]];
    const url = layerCanvas(L2).toDataURL();
    if (APP.heatLayer) APP.heatLayer.setUrl(url);
    else APP.heatLayer = L.imageOverlay(url, bounds, { opacity: 0.6, interactive: false }).addTo(APP.map);
    APP.heatLayer.setOpacity(0.6);
    document.getElementById("legendTitle").textContent = L2.title;
    document.getElementById("legendBar").className = "bar " + L2.bar;
  }
  function drawRoute(coords) {
    const ll = coords.map((p) => [p[1], p[0]]);
    if (APP.routeLayer) APP.map.removeLayer(APP.routeLayer);
    APP.routeLayer = L.polyline(ll, { color: "#37b6ff", weight: APP.navMode ? 8 : 6, opacity: 0.95 }).addTo(APP.map);
  }
  function mark(lat, lon, color, label) {
    return L.circleMarker([lat, lon], { radius: 8, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 })
      .addTo(APP.map).bindTooltip(label, { permanent: true, direction: "top", offset: [0, -6] });
  }
  function setStart(lat, lon) { APP.startLL = [lon, lat]; if (APP.mStart) APP.map.removeLayer(APP.mStart); APP.mStart = mark(lat, lon, "#22c55e", "출발"); }
  function setGoal(lat, lon) { APP.goalLL = [lon, lat]; if (APP.mGoal) APP.map.removeLayer(APP.mGoal); APP.mGoal = mark(lat, lon, "#ef4444", "도착"); }
  function setMe(lat, lon, heading) {
    const icon = L.divIcon({ className: "", iconSize: [26, 26],
      html: '<div class="memark" style="transform:rotate(' + (heading || 0) + 'deg)">' + (APP.navMode ? "➤" : "●") + '</div>' });
    if (APP.mMe) APP.mMe.setLatLng([lat, lon]).setIcon(icon);
    else APP.mMe = L.marker([lat, lon], { icon }).addTo(APP.map);
  }
  function renderAccidents() {
    if (APP.accLayer) APP.map.removeLayer(APP.accLayer);
    APP.accLayer = L.layerGroup((APP.accidents || []).map((x) =>
      L.circleMarker([x[1], x[0]], { radius: 4, color: "#fff", weight: 1, fillColor: "#ff3838", fillOpacity: 0.9 }))).addTo(APP.map);
  }
  function analyzeCell(lon, lat) {
    const rc = cellRC(lon, lat), r = rc[0], c = rc[1];
    const risk = APP.riskM[r][c], conf = APP.confM[r][c], el = document.getElementById("analysis");
    if (risk < 0.03) { el.innerHTML = "<b>지점 분석</b><br>위험 요소가 낮은 지점입니다."; return; }
    const items = Object.keys(APP.weights).map((k) => ({ label: APP.flabels[k], contrib: APP.weights[k] * APP.factors[k][r][c] }));
    const total = items.reduce((s, i) => s + i.contrib, 0) || 1e-9; items.sort((a, b) => b.contrib - a.contrib);
    let html = "<b>📊 지점 분석</b><br>위험도 <b style='color:#ff8a6a'>" + risk.toFixed(2) + "</b> · 신뢰도 <b style='color:#5fa8ff'>" + Math.round(conf * 100) + "%</b><br>";
    items.forEach((i) => { const pct = Math.round(i.contrib / total * 100); html += i.label + " <span class='bar2' style='width:" + Math.max(2, pct) + "px;background:#ff7a4d'></span> <b>" + pct + "%</b><br>"; });
    if (APP.slopeDeg) html += "<span style='opacity:.7'>경사:</span> <b>" + APP.slopeDeg[r][c].toFixed(1) + "°</b> · " + compass8(APP.aspect[r][c]) + "<br>";
    if (APP.alleyW && APP.alleyW[r][c] >= 0) html += "<span style='opacity:.7'>골목 폭:</span> <b>~" + Math.round(APP.alleyW[r][c]) + "m</b><br>";
    el.innerHTML = html;
  }
  function showValidation() {
    const v = APP.validation; if (!v || !v["위험도_배수"]) return;
    document.getElementById("analysis").innerHTML = "🎯 <b>검증(실제 사고 " + (v["사고표본수"] || 0) + "건)</b><br>사고지점 평균 <b style='color:#ff8a6a'>" + v["위험도_배수"] + "배</b> 위험 · <b>" + v["사고_상위25위험구간_포함율%"] + "%</b>가 상위25%<br><span style='opacity:.65'>빨간점=실제 사고지점</span>";
  }

  // ── 검색 (JSONP, 지도 무관) ──
  function esc(s) { return (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = "vwcb_" + Math.random().toString(36).slice(2), s = document.createElement("script");
      const timer = setTimeout(() => { cleanup(); reject(); }, 8000);
      function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = (d) => { cleanup(); resolve(d); }; s.onerror = () => { cleanup(); reject(); };
      s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cb; document.head.appendChild(s);
    });
  }
  async function poiSearch(query) {
    const base = "https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=8&format=json&key=" + encodeURIComponent(KEY) + "&query=" + encodeURIComponent(query);
    for (const t of ["place", "address"]) {
      try {
        const j = await jsonp(base + "&type=" + t);
        const items = (((j.response || {}).result || {}).items) || [], out = [];
        items.forEach((it) => { const p = it.point || {}, x = parseFloat(p.x), y = parseFloat(p.y); if (isFinite(x) && isFinite(y)) { const ad = it.address || {}; out.push({ title: it.title || query, addr: ad.road || ad.parcel || "", lon: x, lat: y }); } });
        if (out.length) return out;
      } catch (e) { }
    }
    return [];
  }
  function attachSearch(input, sugg, which) {
    let timer = null, items = [];
    const close = () => { sugg.classList.remove("open"); sugg.innerHTML = ""; };
    const choose = (it) => { input.value = it.title; close(); (which === "start" ? setStart : setGoal)(it.lat, it.lon); APP.map.setView([it.lat, it.lon], 16); computeRoute(); };
    const render = (list) => {
      items = list || [];
      if (!list.length) sugg.innerHTML = '<div class="empty">검색 결과 없음</div>';
      else { sugg.innerHTML = list.map((it, i) => '<div class="it" data-i="' + i + '"><div class="t">' + esc(it.title) + '</div><div class="a">' + esc(it.addr) + '</div></div>').join(""); [...sugg.querySelectorAll(".it")].forEach((el) => el.addEventListener("mousedown", (ev) => { ev.preventDefault(); choose(list[+el.dataset.i]); })); }
      sugg.classList.add("open");
    };
    input.addEventListener("input", () => { const q = input.value.trim(); clearTimeout(timer); if (q.length < 2) { close(); return; } timer = setTimeout(async () => render(await poiSearch(q)), 250); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && items.length) { e.preventDefault(); choose(items[0]); } });
    input.addEventListener("blur", () => setTimeout(close, 150));
  }

  // ── GPS / 네비게이션 ──
  function inArea(lon, lat) { const a = APP.area; return lon >= a.lon_min && lon <= a.lon_max && lat >= a.lat_min && lat <= a.lat_max; }
  function clampArea(lon, lat) { const a = APP.area; return [Math.min(Math.max(lon, a.lon_min), a.lon_max), Math.min(Math.max(lat, a.lat_min), a.lat_max)]; }
  function remainingDistance(lon, lat) {
    const pts = APP.lastRoute; if (!pts || pts.length < 2) return 0;
    let bi = 0, bd = Infinity; for (let i = 0; i < pts.length; i++) { const d = meters(lon, lat, pts[i][0], pts[i][1]); if (d < bd) { bd = d; bi = i; } }
    let rem = meters(lon, lat, pts[bi][0], pts[bi][1]); for (let i = bi; i < pts.length - 1; i++) rem += meters(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]); return rem;
  }
  function requestHeading() {
    const handler = (e) => { let h = null; if (e.webkitCompassHeading != null) h = e.webkitCompassHeading; else if (e.alpha != null) h = 360 - e.alpha; if (h != null && !isNaN(h)) APP.compassHeading = ((h % 360) + 360) % 360; };
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === "function") DOE.requestPermission().then((s) => { if (s === "granted") window.addEventListener("deviceorientation", handler, true); }).catch(() => {});
    else if (DOE) { window.addEventListener("deviceorientationabsolute", handler, true); window.addEventListener("deviceorientation", handler, true); }
  }
  function onNavPos(pos) {
    let lon = pos.coords.longitude, lat = pos.coords.latitude;
    if (!inArea(lon, lat)) { const p = clampArea(lon, lat); lon = p[0]; lat = p[1]; }
    let hd = APP.compassHeading; if (hd == null && pos.coords.heading != null && !isNaN(pos.coords.heading)) hd = pos.coords.heading; if (hd == null) hd = APP.lastHeading; APP.lastHeading = hd;
    setMe(lat, lon, hd); APP.map.setView([lat, lon], 17, { animate: true });
    const rem = remainingDistance(lon, lat);
    document.getElementById("navdist").innerHTML = rem < 25 ? "🏁 도착!" : (fmtDist(rem) + " <small>남음</small>");
  }
  function startNav() {
    if (!APP.lastRoute || APP.lastRoute.length < 2) { setStatus("먼저 경로를 만들어 주세요."); return; }
    if (!navigator.geolocation) { setStatus("GPS 미지원."); return; }
    APP.navMode = true;
    if (APP.heatLayer) APP.heatLayer.setOpacity(0);              // 히트맵 숨김 → 도로+경로
    if (APP.routeLayer) APP.routeLayer.setStyle({ weight: 8 });
    document.getElementById("navbar").classList.add("on");
    document.getElementById("ctrl").classList.add("collapsed");
    requestHeading();
    APP.navWatch = navigator.geolocation.watchPosition(onNavPos, () => setStatus("위치 권한 필요."), { enableHighAccuracy: true, maximumAge: 1000 });
  }
  function stopNav() {
    APP.navMode = false;
    if (APP.navWatch != null) { navigator.geolocation.clearWatch(APP.navWatch); APP.navWatch = null; }
    if (APP.heatLayer) APP.heatLayer.setOpacity(0.6);
    if (APP.routeLayer) APP.routeLayer.setStyle({ weight: 6 });
    document.getElementById("navbar").classList.remove("on");
    document.getElementById("ctrl").classList.remove("collapsed");
    const a = APP.area; APP.map.setView([(a.lat_min + a.lat_max) / 2, (a.lon_min + a.lon_max) / 2], 13);
  }

  function bindUI() {
    attachSearch(document.getElementById("startAddr"), document.getElementById("startSugg"), "start");
    attachSearch(document.getElementById("goalAddr"), document.getElementById("goalSugg"), "goal");
    document.getElementById("findBtn").addEventListener("click", computeRoute);
    document.getElementById("resetBtn").addEventListener("click", () => {
      [APP.mStart, APP.mGoal, APP.routeLayer, APP.mMe].forEach((m) => m && APP.map.removeLayer(m));
      APP.mStart = APP.mGoal = APP.routeLayer = APP.mMe = null; APP.startLL = APP.goalLL = APP.lastRoute = null; APP.nextClick = "start"; setStatus("출발·도착을 지정하세요.");
    });
    document.getElementById("navStartBtn").addEventListener("click", startNav);
    document.getElementById("navEndBtn").addEventListener("click", stopNav);
    document.getElementById("avoidDiff").addEventListener("change", computeRoute);
    document.getElementById("layerSel").addEventListener("change", (e) => renderHeatmap(e.target.value));
    document.getElementById("gpsBtn").addEventListener("click", () => {
      if (!navigator.geolocation) { setStatus("GPS 미지원."); return; }
      setStatus("현재 위치 확인 중…");
      navigator.geolocation.getCurrentPosition((pos) => { let lon = pos.coords.longitude, lat = pos.coords.latitude; if (!inArea(lon, lat)) setStatus("⚠ 영역 밖 — 경계로 스냅"); const p = clampArea(lon, lat); setStart(p[1], p[0]); APP.map.setView([p[1], p[0]], 16); computeRoute(); }, () => setStatus("위치 권한 거부됨."), { enableHighAccuracy: true, timeout: 8000 });
    });
    document.querySelector("#ctrl h4").addEventListener("click", () => { if (window.matchMedia("(max-width:860px)").matches) document.getElementById("ctrl").classList.toggle("collapsed"); });
    APP.map.on("click", (e) => {
      const lon = e.latlng.lng, lat = e.latlng.lat;
      if (document.getElementById("analyzeMode").checked) { analyzeCell(lon, lat); return; }
      if (APP.nextClick === "start") { setStart(lat, lon); APP.nextClick = "goal"; setStatus("도착지를 지정하세요."); }
      else { setGoal(lat, lon); APP.nextClick = "start"; computeRoute(); }
    });
  }

  function setStatus(h) { const s = document.getElementById("status"); if (s) s.innerHTML = h; }
  function showErr(m) { const e = document.getElementById("err"); e.style.display = "block"; e.innerHTML = m; console.error(m); }
})();
</script>
</body>
